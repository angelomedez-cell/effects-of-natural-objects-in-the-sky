            border: 4px solid black;
            padding: 15px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.2);

            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 0;
            height: 0;
            border: 20px solid transparent;
            border-right-color: black;
            border-left: 0;
            border-bottom: 0;
            margin-top: -10px;
            margin-left: -24px;
        }

            position: absolute;
            left: 0;

            height: 0;

                            generationConfig: { responseModalities: ["TEXT", "IMAGE"] }

                    const result = await response.json();
                    const base64 = result.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
                    if (base64) {
                        return `data:image/jpeg;base64,${base64}`;
                    }
                    throw new Error('No image in response');
                } catch (error) {

                            {/* Character */}
                            <div className="flex flex-col items-center w-1/3 flex-shrink-0">
                                <div className={`w-20 h-20 md:w-32 md:h-32 rounded-full border-4 border-black ${activeChar.color} flex items-center justify-center shadow-[4px_4px_0px_black] mb-2`}>
                                    <span className="text-5xl md:text-7xl animate-float">{activeChar.emoji}</span>
                                </div>
                                <div className="bg-black text-white px-3 py-1 rounded-full border-2 border-white comic-font text-sm md:text-lg tracking-wider shadow-[2px_2px_0px_gray] text-center w-full">
                                    {activeChar.name}
                                </div>
                                <div className="text-[10px] md:text-xs font-bold text-gray-600 mt-1 uppercase text-center">{activeChar.role}</div>
                            </div>

                            {/* Speech Bubble & Controls */}
                            <div className="w-2/3 flex flex-col justify-center h-full">
                                <div className="speech-bubble mb-2 flex-shrink-0">
                                    <div className="speech-bubble-inner text-sm md:text-xl font-bold leading-tight md:leading-relaxed">
                                        "{choiceFeedback ? choiceFeedback : currentDialogue.text}"
                                    </div>
                                </div>
                                
                                {/* Generated Image Photo Box (4:3 Aspect Ratio) */}
                                <div className={`w-full max-w-[160px] md:max-w-[240px] aspect-[4/3] rounded-lg border-2 md:border-4 border-black flex items-center justify-center text-center shadow-[2px_2px_0px_black] md:shadow-[4px_4px_0px_black] mb-2 bg-gray-100 relative overflow-hidden flex-shrink-0 self-center`}>
                                    {generatedImages[activeChar.id] && generatedImages[activeChar.id] !== 'error' ? (
                                        <img src={generatedImages[activeChar.id]} alt="Scenario Scene" className="w-full h-full object-cover" />
                                    ) : (
                                        <div className="text-gray-500 font-sans text-xs">Failed to load drawing.</div>
                                    )}
                                    <div className="absolute top-1 right-2 text-[8px] md:text-[10px] font-bold text-white uppercase border border-white px-1 rotate-12 bg-black/50 backdrop-blur-sm rounded z-10">Scenario</div>
                                </div>

                                <div className="text-right text-[10px] md:text-sm text-gray-500 font-bold mb-2 flex-shrink-0">
                                    Step {dialogueStep + 1} / {activeChar.dialogue.length}
                                </div>

                                <div className="flex flex-col gap-2 mt-auto flex-shrink-0">
                                    {!choiceFeedback && currentDialogue.choices ? (
                                        // Show choices
                                        <div className="flex flex-col gap-2">
                                            {currentDialogue.choices.map((choice, i) => (
                                                <button 
                                                    key={i}
                                                    onClick={() => setChoiceFeedback(choice.response)}
                                                    className="comic-btn text-black px-3 py-2 text-xs md:text-sm bg-yellow-300 hover:bg-yellow-400 w-full text-left"
                                                >
                                                    {choice.label}
                                                </button>
                                            ))}
                                        </div>
                                    ) : (
                                        // Show next button
                                        <button 
                                            onClick={nextDialogue}
                                            className="comic-btn text-black px-4 py-2 text-sm md:text-lg bg-green-400 hover:bg-green-500 w-full md:w-auto self-end"
                                        >
                                            {dialogueStep < activeChar.dialogue.length - 1 ? 'Next 💬' : 'Finish ✨'}
                                        </button>
                                    )}
                                </div>
                            </div>

                        </div>
                    </div>
                );
            };

            const renderSummary = () => (
                <div className="h-full w-full bg-green-200 flex flex-col items-center justify-center p-2 md:p-4">
                    <div className="max-w-4xl w-full h-full comic-panel bg-white p-4 md:p-8 text-center border-yellow-400 border-8 relative flex flex-col justify-center">
                        <div className="absolute top-2 left-2 md:-top-6 md:-left-6 text-4xl md:text-6xl animate-bounce">🏆</div>
                        <div className="absolute top-2 right-2 md:-top-6 md:-right-6 text-4xl md:text-6xl animate-bounce" style={{animationDelay: '0.5s'}}>🌟</div>
                        
                        <div className="absolute top-2 right-12 md:top-4 md:right-24 z-20">
                            {renderAudioBtn()}
                        </div>
                        
                        <h1 className="text-3xl md:text-5xl text-red-600 mb-2 md:mb-4">Congratulations!</h1>
                        <p className="text-sm md:text-xl mb-4 md:mb-6">You talked to everyone and learned so much!</p>
                        
                        <div className="flex flex-col md:flex-row gap-2 md:gap-6 text-left flex-grow overflow-hidden">
                            <div className="flex-1 comic-panel p-2 md:p-4 bg-yellow-100 flex flex-col justify-center">
                                <h2 className="text-xl md:text-2xl text-yellow-800 border-b-2 border-black mb-1 md:mb-2 pb-1">☀️ Sun</h2>
                                <ul className="list-disc list-inside text-xs md:text-sm space-y-1">
                                    <li>Gives light so we can see.</li>
                                    <li>Gives heat to dry clothes.</li>
                                    <li>Helps plants make food.</li>
                                    <li>Acts as a timekeeper.</li>
                                </ul>
                            </div>
                            
                            <div className="flex-1 comic-panel p-2 md:p-4 bg-indigo-100 flex flex-col justify-center">
                                <h2 className="text-xl md:text-2xl text-indigo-800 border-b-2 border-black mb-1 md:mb-2 pb-1">🌙 Moon</h2>
                                <ul className="list-disc list-inside text-xs md:text-sm space-y-1">
                                    <li>Pulls ocean to make tides.</li>
                                    <li>Reflects sunlight at night.</li>
                                    <li>Helps find direction.</li>
                                    <li>Signals time to sleep.</li>
                                </ul>
                            </div>
                        </div>

                        <button 
                            onClick={() => { setUnlocked([]); setView('album'); }}
                            className="comic-btn mt-4 md:mt-6 px-6 py-2 md:py-3 text-lg md:text-2xl bg-blue-500 text-white w-full md:w-auto self-center flex-shrink-0"
                        >
                            Play Again! 🔄
                        </button>
                    </div>
                </div>
            );

            return (
                <div className="h-full w-full relative">
                    <audio 
                        ref={audioRef} 
                        src="https://cdn.pixabay.com/download/audio/2022/04/27/audio_30db298642.mp3" 
                        loop 
                        muted={isMuted}
                        autoPlay
                    />

                    {view === 'loading' && renderLoading()}
                    {view === 'album' && renderAlbum()}
                    {view === 'map' && renderMap()}
                    {view === 'dialogue' && renderDialogue()}
                    {view === 'summary' && renderSummary()}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
